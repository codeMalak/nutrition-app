<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="32" height="32" rx="8" fill="url(#grad)"/>

  <!-- Ring track (faint full circle) -->
  <circle cx="16" cy="16" r="10"
    fill="none" stroke="white" stroke-width="2" stroke-opacity="0.22"/>

  <!-- Ring arc — 270°, gap at bottom -->
  <circle cx="16" cy="16" r="10"
    fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"
    stroke-dasharray="47.12 15.71"
    transform="rotate(135 16 16)"/>

  <!-- Fork tines -->
  <line x1="13" y1="9.5" x2="13" y2="14.5" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="9.5" x2="16" y2="14.5" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="19" y1="9.5" x2="19" y2="14.5" stroke="white" stroke-width="2" stroke-linecap="round"/>

  <!-- Fork bridge -->
  <path d="M13 14.5 C13 16.5 19 16.5 19 14.5"
    fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>

  <!-- Fork handle -->
  <line x1="16" y1="16.5" x2="16" y2="23" stroke="white" stroke-width="2" stroke-linecap="round"/>
</svg>
